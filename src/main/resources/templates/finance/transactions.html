<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Transactions</h1>
<p>Finance transactions will be displayed here.</p>
<p th:if="${#lists.isEmpty(transactions)}">
    No transactions yet.
</p>
<div class="table-responsive" th:if="${!#lists.isEmpty(transactions)}">
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th class="text-end">Amount</th>
            <th>Description</th>
            <th>Date</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transaction : ${transactions}">
            <td th:text="${transaction.id}"></td>
            <td class="text-end" th:text="${transaction.amount}"></td>
            <td th:text="${transaction.description}"></td>
            <td th:text="${transaction.transactionDate}"></td>
            <td th:text="${transaction.type}"></td>
            <td>
                <form method="post" th:action="@{/finance/transactions/{id}/delete(id=${transaction.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure you want to delete this transaction?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="card mb-4">
    <div class="card-body">
        <h2 class="h5 card-title mb-3">Add transaction</h2>
        <form method="post" th:action="@{/finance/transactions}" th:object="${transaction}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                Please fix validation errors.
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">
                    Amount error
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" th:field="*{description}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                    Description error
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" th:field="*{transactionDate}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}">
                    Date error
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" th:field="*{type}" required>
                    <option value="">Select type</option>
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">
                    Type error
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Add transaction</button>
        </form>
    </div>
</div>

</body>
</html>
