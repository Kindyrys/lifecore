<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Transactions</h1>
<p>Finance transactions will be displayed here.</p>
<p th:if="${#lists.isEmpty(transactions)}">
    No transactions yet.
</p>
<table class="table table-striped" th:if="${!#lists.isEmpty(transactions)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Description</th>
        <th>Date</th>
        <th>Type</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.id}"></td>
        <td th:text="${transaction.amount}"></td>
        <td th:text="${transaction.description}"></td>
        <td th:text="${transaction.transactionDate}"></td>
        <td th:text="${transaction.type}"></td>
    </tr>
    </tbody>
</table>
<form class="mb-4">
    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" class="form-control" name="amount">
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control" name="description">
    </div>
    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" name="transactionDate">
    </div>
    <div class="mb-3">
        <label class="form-label">Type</label>
        <select class="form-select" name="type">
            <option value="INCOME">Income</option>
            <option value="EXPENSE">Expense</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Add transaction</button>
</form>

</body>
</html>
