<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Transactions</h1>
<p>Finance transactions will be displayed here.</p>
<p th:if="${#lists.isEmpty(transactions)}">
    No transactions yet.
</p>
<table class="table table-striped" th:if="${!#lists.isEmpty(transactions)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Description</th>
        <th>Date</th>
        <th>Type</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.id}"></td>
        <td th:text="${transaction.amount}"></td>
        <td th:text="${transaction.description}"></td>
        <td th:text="${transaction.transactionDate}"></td>
        <td th:text="${transaction.type}"></td>
    </tr>
    </tbody>
</table>

<form class="mb-4" method="post" th:action="@{/finance/transactions}" th:object="${transaction}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
        Please fix validation errors.
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control" th:field="*{description}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" th:field="*{transactionDate}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Type</label>
        <select class="form-select" th:field="*{type}" required>
            <option value="">Select type</option>
            <option value="INCOME">Income</option>
            <option value="EXPENSE">Expense</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Add transaction</button>
</form>

</body>
</html>
