<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5 card-title mb-3">Edit Transaction</h2>
            <form method="post" th:action="@{/finance/transactions/{id}/edit(id=${transaction.id})}" th:object="${transaction}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">
                        Amount error
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-control" th:field="*{description}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                        Description error
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" th:field="*{transactionDate}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}">
                        Date error
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" th:field="*{type}" required>
                        <option value="">Select type</option>
                        <option value="INCOME">Income</option>
                        <option value="EXPENSE">Expense</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">
                        Type error
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                    <a class="btn btn-secondary" th:href="@{/finance/transactions}">Back to transactions</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
